run:
  timeout: 10m
  tests: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    # Exclude staticcheck deprecation warnings for schema.ResourceData.GetOkExists
    - linters:
        - staticcheck
      text: "SA1019: .* is deprecated"
    # Exclude errcheck from test files
    - path: _test\.go
      linters:
        - errcheck
        - gosec
        - dupl

linters:
  enable:
    - gofmt
    - goimports
    - govet
    - typecheck
    - unconvert
    - staticcheck
    - gosimple
    - errcheck
    - ineffassign
    - unused

linters-settings:
  errcheck:
    exclude-functions:
      # Ignore error checking for schema.Set operations (both value and pointer receivers)
      - (github.com/hashicorp/terraform-plugin-sdk/v2/helper/schema.ResourceData).Set
      - (*github.com/hashicorp/terraform-plugin-sdk/v2/helper/schema.ResourceData).Set
      - (github.com/hashicorp/terraform-plugin-sdk/v2/helper/schema.ResourceData).SetId
      - (*github.com/hashicorp/terraform-plugin-sdk/v2/helper/schema.ResourceData).SetId
      # Ignore error checking for fmt.Fprint and similar
      - fmt.Fprint
      - fmt.Fprintf
      - fmt.Fprintln
  govet:
    settings:
      printf:
        funcs:
          - diag.Errorf
          - diag.Warningf
  nakedret:
    max-func-lines: 40
