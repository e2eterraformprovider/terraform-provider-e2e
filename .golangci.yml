version: "2"

run:
  timeout: 60m
  tests: true
#  modules-download-mode: vendor

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    # Exclude staticcheck deprecation warnings for schema methods
    - linters:
        - staticcheck
      text: "SA1019: .* is deprecated"
    # Exclude errcheck from test files
    - path: _test\.go
      linters:
        - errcheck
        - gosec
        - dupl

formatters:
  enable:
    - gofmt
    - goimports

linters:
  disable-all: true
  enable:
    - govet
    - unconvert
    - staticcheck
    - errcheck
    - ineffassign
    - unused

linters-settings:
  errcheck:
    exclude-functions:
      # Ignore error checking for schema.Set operations
      - (github.com/hashicorp/terraform-plugin-sdk/v2/helper/schema.ResourceData).Set
      - (*github.com/hashicorp/terraform-plugin-sdk/v2/helper/schema.ResourceData).Set
      - (github.com/hashicorp/terraform-plugin-sdk/v2/helper/schema.ResourceData).SetId
      - (*github.com/hashicorp/terraform-plugin-sdk/v2/helper/schema.ResourceData).SetId
      # Ignore error checking for fmt and io
      - fmt.Fprint
      - fmt.Fprintf
      - fmt.Fprintln
  govet:
    disable:
      - printf
  nakedret:
    max-func-lines: 40
