linters-settings:
  errcheck:
    # Ignore error checking in test files
    exclude-functions:
      - (io.Closer).Close
      - (io.ReadCloser).Close

run:
  timeout: 5m
  tests: true

issues:
  exclude-rules:
    # Exclude some linters from running on tests files
    - path: _test\.go
      linters:
        - errcheck
        - gosec
        - dupl
    # Exclude test helper files
    - path: testing\.go
      linters:
        - errcheck

linters:
  enable:
    - errcheck
    - gosimple
    - ineffassign
    - staticcheck
    - unused
