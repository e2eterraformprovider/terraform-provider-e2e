run:
  timeout: 10m

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    # Exclude staticcheck deprecation warnings for schema.ResourceData.GetOkExists
    - linters:
        - staticcheck
      text: "SA1019: .* is deprecated"

linters:
  enable:
    - gofmt
    - goimports
    - govet
    - typecheck
    - unconvert
    - staticcheck
    - gosimple
    - errcheck
    - ineffassign
    - unused

linters-settings:
  errcheck:
    exclude-functions:
      # Ignore error checking for schema.Set operations
      - (github.com/hashicorp/terraform-plugin-sdk/v2/helper/schema.ResourceData).Set
      - (github.com/hashicorp/terraform-plugin-sdk/v2/helper/schema.ResourceData).SetId
      # Ignore error checking for fmt.Fprint and similar
      - fmt.Fprint
      - fmt.Fprintf
      - fmt.Fprintln
      # Ignore Close on response bodies (already logged with defer)
      - (io.Closer).Close
      - (io.ReadCloser).Close
  govet:
    settings:
      printf:
        funcs:
          - diag.Errorf
          - diag.Warningf
  nakedret:
    max-func-lines: 40
