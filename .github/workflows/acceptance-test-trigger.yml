name: Acceptance Test Trigger

on:
  issue_comment:
    types: [created]

jobs:
  testacc-trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Slash Command Dispatch
        uses: peter-evans/slash-command-dispatch@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-type: pull-request
          commands: testacc
          named-args: true
          permission: write
