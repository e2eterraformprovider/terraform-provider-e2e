name: Acceptance Test PR

on:
  repository_dispatch:
    types: [testacc-command]

jobs:
  acceptance-test:
    runs-on: ubuntu-latest
    if: |
      github.event.client_payload.slash_command.args.named.sha != '' &&
      github.event.client_payload.slash_command.args.named.package != '' &&
      github.event.client_payload.pull_request.head.sha == github.event.client_payload.slash_command.args.named.sha
    concurrency:
      group: testacc-${{ github.event.client_payload.slash_command.args.named.package }}-${{ github.event.client_payload.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Add initial reaction
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.event.client_payload.github.payload.repository.full_name }}
          comment-id: ${{ github.event.client_payload.github.payload.comment.id }}
          reactions: eyes

      - name: Post Pending Status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/statuses/${{ github.event.client_payload.slash_command.args.named.sha }} \
            -f state='pending' \
            -f target_url='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}' \
            -f description='Running acceptance tests...' \
            -f context="Acceptance Tests (${{ github.event.client_payload.slash_command.args.named.package }})"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.pull_request.head.ref }}

      - name: Run Acceptance Tests
        id: testacc
        continue-on-error: true
        env:
          # Add your E2E provider credentials here
          E2E_TOKEN: ${{ secrets.E2E_TOKEN }}
          TESTARGS: -run ${{ github.event.client_payload.slash_command.args.named.package }}
        run: |
          make testacc TESTARGS="${TESTARGS}" ACCTEST_PARALLELISM=10

      - name: Determine test result
        id: result
        run: |
          if [ "${{ steps.testacc.outcome }}" == "success" ]; then
            echo "state=success" >> $GITHUB_OUTPUT
            echo "description=Acceptance tests passed" >> $GITHUB_OUTPUT
          else
            echo "state=failure" >> $GITHUB_OUTPUT
            echo "description=Acceptance tests failed" >> $GITHUB_OUTPUT
          fi

      - name: Post Final Status
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/statuses/${{ github.event.client_payload.slash_command.args.named.sha }} \
            -f state='${{ steps.result.outputs.state }}' \
            -f target_url='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}' \
            -f description='${{ steps.result.outputs.description }}' \
            -f context="Acceptance Tests (${{ github.event.client_payload.slash_command.args.named.package }})"

      - name: Add reaction on success
        if: steps.testacc.outcome == 'success'
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.event.client_payload.github.payload.repository.full_name }}
          comment-id: ${{ github.event.client_payload.github.payload.comment.id }}
          reactions: hooray

      - name: Add reaction on failure
        if: steps.testacc.outcome != 'success'
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.event.client_payload.github.payload.repository.full_name }}
          comment-id: ${{ github.event.client_payload.github.payload.comment.id }}
          reactions: confused
