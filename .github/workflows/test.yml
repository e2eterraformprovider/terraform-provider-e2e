name: Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  # Unit tests across supported Go versions
  test:
    name: Unit Tests (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - '1.24.x'
          - '1.25.x'
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Check out code
        uses: actions/checkout@v4

      - name: Go Vet
        run: make vet

      - name: Lint with golangci-lint
        run: make lint

      # Disabled terrafmt check for now
      # - name: Format Check
      #   run: make terrafmt-check

      - name: Run Tests
        run: make test
